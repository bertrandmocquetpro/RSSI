name: Vérifications Valmont
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run build:pages
      - run: git diff --exit-code -- docs
      - run: npm run check
      - run: npm test
